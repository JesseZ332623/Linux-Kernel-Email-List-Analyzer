# DeepSeek 模型对话属性配置
app:
  deepseek-chat:
    # Linux 内核邮件分析任务模型配置
    lkml-analyzer:
      # AI 模型对话端点
      model-endpoint-url: https://api.deepseek.com/chat/completions
      # 模型名称
      model-name: deepseek-v4-pro
      # 端点访问身份凭证名
      authorization-name: deepseek-lkml-analyzer
      # 是否开启推理模式
      thinking: enabled
      # 模型的推理强度
      reasoning-effort: high
      # 是否流式输出
      stream: false
      # 系统提示词文件所在的类路径
      sys-prompts-classpath: "classpath:/prompts/lkml-system-role-prompt.md"
      # 用户提示词文件所在的类路径
      usr-prompts-classpath: "classpath:/prompts/lkml-user-role-prompt.md"

    # 内核邮件分析报告答疑解惑上下文摘要模型配置
    analyzer-report-chat-abstract:
      # AI 模型对话端点
      model-endpoint-url: https://api.deepseek.com/chat/completions
      # 模型名称
      model-name: deepseek-v4-flash
      # 端点访问身份凭证名
      authorization-name: deepseek-analyzer-report-chat-abstract
      # 是否开启推理模式
      thinking: disabled
      # 模型的推理强度
      reasoning-effort: high
      # 是否流式输出
      stream: false
      # 系统提示词文件所在的类路径
      sys-prompts-classpath: "classpath:/prompts/lkml-analyzer-report-abstract-system-role-prompt.md"
      # 用户提示词文件所在的类路径
      usr-prompts-classpath: "classpath:/prompts/lkml-analyzer-report-abstract-usr-role-prompt.md"

    # 内核邮件分析报告答疑解惑模型配置
    analyzer-report-chat:
      # AI 模型对话端点
      model-endpoint-url: https://api.deepseek.com/chat/completions
      # 模型名称
      model-name: deepseek-v4-pro
      # 端点访问身份凭证名
      authorization-name: deepseek-analyzer-report-chat
      # 是否开启推理模式
      thinking: enabled
      # 模型的推理强度
      reasoning-effort: high
      # 是否流式输出
      stream: true
      # 系统提示词文件所在的类路径
      sys-prompts-classpath: "classpath:/prompts/lkml-analyzer-report-chat-system-role-prompt.md"
      # 用户提示词文件所在的类路径
      usr-prompts-classpath: "classpath:/prompts/lkml-analyzer-report-chat-usr-role-prompt.md"