# RabbitMQ 属性配置

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: jesse
    password: 1234567890
    virtual-host: /
    requested-heartbeat: 10s
    listener:
      simple:
        acknowledge-mode: manual # 手动确认模式
        concurrency: 50      # 并发消费者数量
        max-concurrency: 75  # 最大并发消费者数量
        prefetch: 1          # 每个消费者一次只取 1 条消息

    # 生产端消息确认方式
    # Spring AMQP 协议有三个档位
    # 1. none channel 不进入 confirm 模式，
    #         broker 不会为你的消息发回任何 ack/nack
    #
    # 2. correlated 每条消息挂一个 CorrelationData，
    #               broker 异步回 ack/nack，结果写入该对象
    #
    # 3. simple 老的同步等待模式，性能差，已不推荐
    #
    # 现代开发中一般选择 correlated 档位，
    # 这样就可以在配置中注册 confirm callback，异步的执行生产端消息确认回调
    # 或者调用 CorrelationData::getFuture() 方法同步的等待确认
    # 本项目选用后者，因为涉及到业务状态流转，通用的回调无法覆盖所有场景
    publisher-confirm-type: correlated

app:
  rabbitmq-queue-props:
    lkml:
      # 内核邮件交换机名
      exchange-name: lkml.exchange
      # 内核邮件消息队列名
      queue-name: lkml.queue
      # 内核邮件消息路由键（交换机靠本路由键精确投递消息）
      routing-key: lkml.key

      # 公用的死信交换机名
      dlx-exchange-name: dlx.exchange
      # 内核邮件死信消息队列名
      dlx-queue-name: lkml.dlx.queue
      # 内核邮件死信路由键
      dlx-routing-key: lkml.dlx.key

      # 客户端等待 broker 确认收到消息的超时时间
      publisher-confirm-timeout: 3s

  # 每次往消息队列推送的内核补丁邮件数量（-1 表示全量推送）
  lkml-push-limit: 1000

