# Mybatis-Plus 属性配置

mybatis-plus:
  # 枚举类包扫描路径（KernelEmailStatus 携带 @EnumValue，位于 com.jesse.core.enums）
  type-enums-package: com.jesse.core.enums

  configuration:
    # 不输出任何有关本依赖的日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

    # 使用标准的日志输出实现
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl